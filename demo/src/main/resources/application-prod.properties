# ------------------------------------------------------------------
# Profil "prod": Produktivbetrieb
# Zugangsdaten stehen bewusst NICHT in der Datei, sondern kommen aus
# Umgebungsvariablen. Fehlt eine davon, startet die App nicht.
# ------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Nur Warnungen und Fehler protokollieren (keine personenbezogenen Daten im Log)
logging.level.root=WARN
logging.level.com.example.demo=INFO

# Keine technischen Details (Stacktraces, Meldungen) an Besucher ausgeben
server.error.include-stacktrace=never
server.error.include-message=never

# Session-Cookie nur über HTTPS und nicht per JavaScript lesbar
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
