spring.application.name=demo

# Verbindung zur Datenbank 
spring.datasource.url=jdbc:mysql://localhost:3306/bewerberportal_test?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

logging.level.org.springframework.security=DEBUG

server.port=9090

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
# Tomcat bricht zu große Uploads sonst (ab 2 MB Überhang) mit "Verbindung zurückgesetzt" ab,
# bevor unsere Fehlerseite angezeigt werden kann
server.tomcat.max-swallow-size=-1
