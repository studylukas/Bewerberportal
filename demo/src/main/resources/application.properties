spring.application.name=demo

# ------------------------------------------------------------------
# Gemeinsame Einstellungen für ALLE Profile.
# Profilspezifisches steht in application-dev/-test/-prod.properties.
# Ohne Angabe startet die App im Profil "dev";
# anderes Profil z. B. per Umgebungsvariable SPRING_PROFILES_ACTIVE=prod
# ------------------------------------------------------------------
spring.profiles.default=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Das Datenbankschema verwaltet ausschließlich Flyway (db/migration).
# Hibernate darf keine Tabellen/Spalten mehr selbst anlegen oder ändern.
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=9090

# Datei-Upload (UC-B03): je Datei max. 5 MB, gesamte Anfrage max. 20 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
# Tomcat bricht zu große Uploads sonst (ab 2 MB Überhang) mit "Verbindung zurückgesetzt" ab,
# bevor unsere Fehlerseite angezeigt werden kann
server.tomcat.max-swallow-size=-1
