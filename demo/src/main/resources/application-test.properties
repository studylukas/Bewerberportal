# ------------------------------------------------------------------
# Profil "test": Testsystem mit eigener Datenbank
# Werte können per Umgebungsvariable überschrieben werden,
# sonst gelten die Standardwerte hinter dem Doppelpunkt.
# ------------------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bewerberportal_testsystem?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Normales Logging, eigene Klassen etwas ausführlicher
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
