<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: layout(~{::title}, 'recruiter', ~{::main})}">
<head>
    <title>Startseite Recruiterportal</title>
</head>
<body>
<main>
    <h1 class="h4 text-center text-muted mb-4">Startseite Recruiterportal</h1>

    <div class="d-flex flex-wrap gap-3 justify-content-center">
        <div class="card position-relative shadow-sm" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Offene Bewerbungen</h5>
                <p class="card-text">Hier gehts zu den offenen Bewerbungen</p>
                <a th:href="@{/recruiter/listeBewerbungen}" class="stretched-link"></a>
            </div>
        </div>
        <div class="card position-relative shadow-sm" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Offene Stellen</h5>
                <p class="card-text">Hier gehts zu den offenen Stellen</p>
                <a th:href="@{/stellen/liste}" class="stretched-link"></a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
