<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: layout(~{::title}, 'bewerber', ~{::main})}">
<head>
    <title th:text="${titel}">Fehler</title>
</head>
<body>
<main class="bg-white p-5 rounded shadow-sm mx-auto text-center" style="max-width: 800px;">
    <h1 class="fw-bold mb-3" th:text="${titel}">Fehler</h1>
    <p class="text-muted fs-5" th:text="${meldung}"></p>

    <!-- Zurück ins Formular: der Browser behält die meisten Eingaben -->
    <a href="javascript:history.back()" class="btn btn-primary mt-4">Zurück</a>
    <a th:href="@{/}" class="btn btn-outline-secondary mt-4 ms-2">Zur Startseite</a>
</main>
</body>
</html>
