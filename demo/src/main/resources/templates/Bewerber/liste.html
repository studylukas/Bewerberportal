<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: layout(~{::title}, 'bewerber', ~{::main})}">
<head>
    <title>Offene Stellen</title>
</head>
<body>
<main class="bg-white p-4 rounded shadow-sm">
    <!-- Kurzvorstellung des Unternehmens -->
    <div class="mb-5">
        <h1 class="fw-bold">Willkommen bei Lukas Recruiting</h1>
        <p class="text-muted fs-5 mb-0">
            Hier steht ein kurzer Text zum Unternehmen – wer ihr seid und warum man bei euch arbeiten sollte.
        </p>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Übersicht aller offenen Stellen</h2>
    </div>

    <!-- Suche und Filter (UC-B01): GET, weil nur gelesen wird; die URL lässt sich als Lesezeichen speichern -->
    <form method="get" th:action="@{/}" class="row g-2 align-items-end mb-4">
        <div class="col-md-5">
            <label for="stichwort" class="form-label fw-medium">Stichwort</label>
            <input type="text" id="stichwort" name="stichwort" class="form-control"
                   placeholder="z. B. Java, Vertrieb ..." th:value="${stichwort}">
        </div>
        <div class="col-md-3">
            <label for="bereich" class="form-label fw-medium">Bereich</label>
            <select id="bereich" name="bereich" class="form-select">
                <option value="">Alle</option>
                <option th:each="b : ${bereiche}" th:value="${b}" th:text="${b}"
                        th:selected="${b == bereich}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="standort" class="form-label fw-medium">Standort</label>
            <select id="standort" name="standort" class="form-select">
                <option value="">Alle</option>
                <option th:each="o : ${standorte}" th:value="${o}" th:text="${o}"
                        th:selected="${o == standort}"></option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">Suchen</button>
            <a th:href="@{/}" class="btn btn-outline-secondary" title="Filter zurücksetzen">&times;</a>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(bewerberListe)}" class="text-muted fst-italic">Keine passenden Stellen gefunden.</p>

    <!-- Bootstrap Tabelle -->
    <table class="table table-striped table-hover align-middle" th:unless="${#lists.isEmpty(bewerberListe)}">
        <thead class="table-dark">
            <tr>
                <th>Bezeichnung</th>
                <th>Bereich</th>
                <th>Standort</th>
                <th>Beschreibung</th>
            </tr>
        </thead>
        <tbody>
            <!-- Die Thymeleaf-Schleife geht jede Stelle in der Liste durch -->
            <tr th:each="stelle : ${bewerberListe}">
                <td class="fw-bold">
                    <a th:href="@{/bewerber/stellen/{id}(id=${stelle.id})}" th:text="${stelle.bezeichnung}"></a>
                </td>

                <td th:text="${stelle.bereich}"></td>
                <td th:text="${stelle.standort ?: '–'}"></td>
                <!-- 'pre-line' sorgt dafür, dass Zeilenumbrüche im Text erhalten bleiben -->
                <td style="white-space: pre-line; max-width: 400px;" th:text="${stelle.beschreibung}"></td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
