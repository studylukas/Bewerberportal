<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: layout(~{::title}, 'bewerber', ~{::main})}">
<head>
    <title>Recruiter-Login</title>
</head>
<body>
<main class="card shadow-sm mx-auto" style="max-width: 400px;">
    <div class="card-body p-4">
        <h1 class="h5 card-title text-center text-muted mb-3">Recruiter-Login</h1>
        <div th:if="${param.error}"
            class="alert alert-danger">
            E-Mail oder Passwort falsch.
        </div>

        <div th:if="${param.logout}"
            class="alert alert-success">
            Erfolgreich abgemeldet.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label class="form-label" for="email">Emailadresse</label>
                <input class="form-control" type="text" id="email" name="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Passwort</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Anmelden</button>
        </form>
    </div>
</main>
</body>
</html>
