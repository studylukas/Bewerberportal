<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: layout(~{::title}, 'recruiter', ~{::main})}">
<head>
    <title>Bewerbungen</title>
</head>
<body>
<main class="bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Übersicht aller offenen Bewerbungen</h2>
    </div>

    <!-- Hinweis, wenn noch keine Bewerbungen vorhanden sind -->
    <div th:if="${#lists.isEmpty(bewerbungListe)}" class="alert alert-info">
        Es liegen aktuell keine Bewerbungen vor.
    </div>

    <!-- Bootstrap Tabelle -->
    <table th:unless="${#lists.isEmpty(bewerbungListe)}" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Bewerber</th>
                <th>Kontakt</th>
                <th>Stelle</th>
                <th>Beworben am</th>
                <th>Status</th>
                <th>Anschreiben</th>
            </tr>
        </thead>
        <tbody>
            <!-- Die Thymeleaf-Schleife geht jede Bewerbung in der Liste durch -->
            <tr th:each="bewerbung : ${bewerbungListe}"
                th:data-href="@{/recruiter/bewerbungen/{b}/{s}(b=${bewerbung.bewerber.id}, s=${bewerbung.stelle.id})}"
                onclick="if (!event.target.closest('a')) window.location = this.dataset.href"
                style="cursor: pointer;">

                <td class="fw-bold" th:text="${bewerbung.bewerber.vorname + ' ' + bewerbung.bewerber.nachname}"></td>

                <td>
                    <a th:href="'mailto:' + ${bewerbung.bewerber.email}" th:text="${bewerbung.bewerber.email}"></a><br>
                    <span class="text-muted" th:text="${bewerbung.bewerber.telefon}"></span>
                </td>

                <td>
                    <a th:href="@{/stellen/details/{id}(id=${bewerbung.stelle.id})}" th:text="${bewerbung.stelle.bezeichnung}"></a>
                </td>

                <td th:text="${#temporals.format(bewerbung.beworbenAm, 'dd.MM.yyyy HH:mm')}"></td>

                <td>
                    <span class="badge" th:classappend="${bewerbung.status.badgeKlasse}"
                          th:text="${bewerbung.status.anzeigename}"></span>
                </td>

                <!-- 'pre-line' sorgt dafür, dass Zeilenumbrüche im Text erhalten bleiben -->
                <td style="white-space: pre-line; max-width: 400px;" th:text="${bewerbung.anschreiben}"></td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
