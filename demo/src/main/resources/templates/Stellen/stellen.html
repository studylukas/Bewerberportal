<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellen</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">

        <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom">
            <span class="fs-4 fw-bold text-primary">Lukas Recruiting</span>
        </header>
        <main class="row justify-content-center">
            <div class="col-md-6">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="mb-4">Stellen anlegen</h1>
                    <a th:href="@{/stellen/liste}" class="btn btn-secondary">Abbrechen</a>
                </div>
                <form th:action="@{/stellen}" th:object="${stellen}" method="post" class="card p-4 shadow-sm">
                    
                    <!-- Bezeichnung -->
                    <div class="mb-3">
                        <label th:for="bezeichnung" class="form-label fw-medium">Stellenbezeichnung</label>
                        <input type="text" th:field="*{bezeichnung}" class="form-control" placeholder="Facility Manager">
                    </div>

                    <!-- Beschreibung -->
                    <div class="mb-3">
                        <label th:for="beschreibung" class="form-label fw-medium">Beschreibung</label>
                         <textarea th:field="*{beschreibung}" 
                                    class="form-control" 
                                    rows="8" 
                                     placeholder="Füge hier die Aufgaben, Anforderungen und Benefits ein..."></textarea>
                    </div>

                    <!-- Bereich -->
                    <div class="mb-3">
                        <label th:for="bereich" class="form-label fw-medium">Bereich</label>
                        <input type="text" th:field="*{bereich}" class="form-control" placeholder="IT-Department">
                    </div>

                    <!-- Stellen Status -->
                    <div class="mb-3">
                        <label th:for="stellenStatus" class="form-label fw-medium">Stellen Status</label>
                        <input type="text" th:field="*{stellenStatus}" class="form-control" placeholder="Super">
                    </div>
                    <!-- Button -->
                    <button type="submit" class="btn btn-primary w-100 mt-2">Speichern</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
