<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: layout(~{::title}, 'bewerber', ~{::main})}">
<head>
    <title>Lukas Recruiting</title>
</head>
<body>
<main>
    <h1 class="h4 text-center text-muted mb-4">Willkommen bei Lukas Recruiting</h1>

    <div class="d-flex flex-wrap gap-3 justify-content-center">
        <div class="card position-relative shadow-sm" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Bewerberportal</h5>
                <p class="card-text">Offene Stellen ansehen und bewerben</p>
                <a th:href="@{/bewerber/stellen}" class="stretched-link"></a>
            </div>
        </div>
        <div class="card position-relative shadow-sm" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Recruiterportal</h5>
                <p class="card-text">Anmelden und Bewerbungen verwalten</p>
                <a th:href="@{/login}" class="stretched-link"></a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
